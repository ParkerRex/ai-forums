name: vai-forums

services:
  postgres:
    image: postgres:16-alpine
    container_name: vai-forums-postgres
    environment:
      POSTGRES_USER: vai_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: vai_db
    ports:
      - "5432:5432"
    volumes:
      - vai-forums-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vai_user -d vai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vai-forums-redis
    ports:
      - "6381:6379"
    volumes:
      - vai-forums-redis-data:/data
    command: redis-server --appendonly yes

volumes:
  vai-forums-postgres-data:
  vai-forums-redis-data:
